name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: IntelliJ ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: '2026.2.3'
            slidev: '52.14.1'
          - platform: '263.7307.112'
            slidev: '52.20.1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install isolated Slidev fixture
        run: npm install --prefix "$RUNNER_TEMP/slidev-fixture" --no-audit --no-fund @slidev/cli@${{ matrix.slidev }} @slidev/theme-default
      - name: Compile, check and package
        run: ./gradlew --no-daemon check buildPlugin -PplatformVersion=${{ matrix.platform }} -PslidevTestProject="$RUNNER_TEMP/slidev-fixture"
      - name: Verify compatibility
        if: matrix.platform == '2026.2.3'
        run: ./gradlew --no-daemon verifyPlugin
      - name: Upload plugin and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slidev-intellij-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            build/distributions/*.zip
            build/reports/
            build/test-results/
